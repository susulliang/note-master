name: Desktop Release

# Build & release signed desktop bundles (Tauri 2.x) on every push to main.
#
#   - macOS arm64  → .app + .dmg (ad-hoc signed; notarized when Apple
#                    Developer ID + notarization secrets are provided)
#   - Windows x64  → .msi + .exe (Authenticode-signed when a PFX cert secret
#                    is provided; otherwise unsigned)
#
# Secrets required (set in GitHub repo → Settings → Secrets and variables):
#   DEEPSEEK_API_KEY      — injected into the bundle as VITE_DEEPSEEK_API_KEY
#   (optional) TAURI_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   (optional) TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_KEYSTORE_PASSWORD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64

    runs-on: ${{ matrix.os }}
    env:
      # Force Node 24 on all JS actions (runner is Node 24, but some
      # action versions still target Node 20 which is now deprecated).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Double-check the target is actually installed (dtolnay/rust-toolchain
      # should handle this, but explicit rustup is cheap and avoids silent
      # "target not installed" failures during cargo build).
      - name: Verify Rust target
        run: |
          rustup target list --installed
          rustup target add ${{ matrix.target }} || true
          rustc --version
          cargo --version

      - name: Install WebView2 (Windows)
        if: runner.os == 'Windows'
        run: |
          # Tauri 2.x on Windows needs the WebView2 runtime. GitHub-hosted
          # windows-latest runners have it pre-installed, but explicit install
          # avoids "WebView2 not found" failures on newer images.
          curl -L https://go.microsoft.com/fwlink/p/?LinkId=2124703 -o EvergreenBootstrapper.exe
          .\EvergreenBootstrapper.exe /silent /install || echo "WebView2 already installed or install failed — continuing"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install p7zip

      - name: Install npm dependencies
        run: npm ci

      - name: Write DeepSeek API key to .env
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            echo "VITE_DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY" > .env
            echo "DeepSeek API key written to .env"
          else
            echo "::warning::DEEPSEEK_API_KEY secret not set — AI parse features will require manual key entry"
          fi
        shell: bash

      - name: Build Tauri app
        env:
          TAURI_SIGNING_IDENTITY: ${{ secrets.TAURI_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.TAURI_SIGNING_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          # GitHub renders unset secrets as EMPTY-STRING env vars, and
          # tauri-bundler treats a present-but-empty APPLE_ID as "notarize".
          # Without Apple credentials that fails with "Team ID must be at
          # least 3 characters" — so drop any empty credential vars first
          # and build ad-hoc signed only.
          for v in TAURI_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_KEYSTORE_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              unset "$v"
              echo "secret not configured — building without $v"
            fi
          done
          npx tauri build --target ${{ matrix.target }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -r "src-tauri/target/${{ matrix.target }}/release/bundle/macos/"*.app release/ 2>/dev/null || true
            cp "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/"*.dmg release/ 2>/dev/null || true
          else
            cp "src-tauri/target/${{ matrix.target }}/release/bundle/msi/"*.msi release/ 2>/dev/null || true
            cp "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/"*.exe release/ 2>/dev/null || true
          fi
          ls -lh release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ecovacs-ticket-notes-${{ matrix.label }}
          path: release/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Needed for the "Get version" step below — package.json lives in the
      # repo, not in the build artifacts.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.dmg" -o -name "*.app" -o -name "*.msi" -o -name "*.exe" \) -exec cp -r {} release/ \;
          ls -lh release/

      - name: Get version
        id: version
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Ecovacs Ticket Notes ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: release/*
          body: |
            Desktop release of Ecovacs Ticket Notes v${{ steps.version.outputs.version }}.

            ## Downloads
            - **macOS (Apple Silicon)**: `.dmg` file
            - **Windows (x64)**: `.msi` or `.exe` installer

            Built automatically from the latest `main` branch via Tauri 2.x.
