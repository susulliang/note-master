[package]
name = "ecovacs-ticket-notes"
version = "0.3.0"
description = "Ecovacs Ticket Notes — flowchart-driven call script desktop app"
authors = ["Ecovacs NA Ops"]
license = "UNLICENSED"
repository = "https://github.com/susulliang/note-master"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
