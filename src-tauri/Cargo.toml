[package]
name = "ecovacs-ticket-notes"
version = "0.7.27"
description = "Ecovacs Ticket Notes — flowchart-driven call script desktop app"
authors = ["Ecovacs NA Ops"]
license = "UNLICENSED"
repository = "https://github.com/susulliang/note-master"
edition = "2021"
rust-version = "1.80"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# "macos-private-api" — required for transparent windows on macOS (the
# desktop-cat overlay). No effect on Windows/other targets.
tauri = { version = "2.12.1", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
cpal = "0.15"

# macOS-only: ScreenCaptureKit system-audio capture (no virtual driver needed)
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11", features = ["macos_13_0"] }

# Windows-only: WASAPI loopback capture of the default render device
# (system audio — the equivalent of ScreenCaptureKit on macOS)
[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.25"
